name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.GCP_VM_HOST }}" ] || [ -z "${{ secrets.GCP_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::GCP_VM_HOST or GCP_SSH_PRIVATE_KEY secret is not configured in GitHub repository settings. Skipping auto-deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/neoerp
            chmod +x update.sh
            ./update.sh
