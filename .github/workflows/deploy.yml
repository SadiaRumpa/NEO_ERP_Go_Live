name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configuration
        id: check_secrets
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$GCP_VM_HOST" ] || [ -z "$GCP_VM_USER" ] || [ -z "$GCP_SSH_PRIVATE_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::One or more required secrets (GCP_VM_HOST, GCP_VM_USER, GCP_SSH_PRIVATE_KEY) are missing in GitHub repository settings. Skipping auto-deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare SSH private key
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          RAW_SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          # Detect base64 encoding vs raw PEM/OpenSSH format
          if echo "$RAW_SSH_KEY" | base64 -d 2>/dev/null | grep -q "BEGIN"; then
            echo "$RAW_SSH_KEY" | base64 -d > /tmp/deploy_key
          else
            # Replace literal \n with real newlines in case secret was pasted on a single line
            printf '%s\n' "$RAW_SSH_KEY" | sed 's/\\n/\n/g' > /tmp/deploy_key
          fi
          # Ensure trailing newline and set 600 permissions
          sed -i -e '$a\' /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key_path: /tmp/deploy_key
          port: 22
          script_stop: true
          script: |
            # Ensure git and curl are installed on the VM
            command -v git >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y git curl)

            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            if [ ! -d ~/neoerp ]; then
              echo "==> ~/neoerp does not exist on VM. Performing initial automated clone & deployment..."
              git clone "$REPO_URL" ~/neoerp
              cd ~/neoerp
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
              chmod +x deploy-gcp.sh update.sh
              ./deploy-gcp.sh
            else
              echo "==> ~/neoerp found. Synchronizing latest commit from GitHub..."
              cd ~/neoerp
              git fetch "$REPO_URL" main
              git reset --hard FETCH_HEAD
              chmod +x update.sh deploy-gcp.sh
              ./update.sh
            fi

      - name: Cleanup SSH private key
        if: always()
        run: rm -f /tmp/deploy_key
