name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Check secrets configuration
        id: check_secrets
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$GCP_VM_HOST" ] || [ -z "$GCP_VM_USER" ] || [ -z "$GCP_SSH_PRIVATE_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::One or more required secrets (GCP_VM_HOST, GCP_VM_USER, GCP_SSH_PRIVATE_KEY) are missing in GitHub repository settings. Skipping auto-deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare SSH private key
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          RAW_SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Check if base64 encoded
          if echo "$RAW_SSH_KEY" | tr -d '\r\n ' | base64 -d 2>/dev/null | grep -q "BEGIN"; then
            echo "$RAW_SSH_KEY" | tr -d '\r\n ' | base64 -d > /tmp/deploy_key
          else
            # Interpret literal \n if single line, or keep as-is
            printf '%b\n' "$RAW_SSH_KEY" > /tmp/deploy_key
          fi
          sed -i -e '$a\' /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Validate key format
          if ! grep -q -E '^-----BEGIN .*PRIVATE KEY-----' /tmp/deploy_key; then
            echo "::error ::/tmp/deploy_key does not look like a valid private key (missing BEGIN header)"
            head -n 2 /tmp/deploy_key || true
            exit 1
          fi
          echo "SSH key formatted and validated successfully."

      - name: Test SSH connection
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "Testing SSH connection to ${GCP_VM_USER}@${GCP_VM_HOST}..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i /tmp/deploy_key "${GCP_VM_USER}@${GCP_VM_HOST}" 'echo "==> SSH authentication successful! Connected to $(hostname) as $(whoami)."'

      - name: Ensure target directory and rsync on VM
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "Preparing ~/neoerp directory on VM..."
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key "${GCP_VM_USER}@${GCP_VM_HOST}" '
            mkdir -p ~/neoerp
            command -v rsync >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y rsync)
          '

      - name: Sync repository files to VM via rsync
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "Syncing code to ${GCP_VM_HOST}:~/neoerp/..."
          rsync -avz \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'storage/logs/*' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${GCP_VM_USER}@${GCP_VM_HOST}:~/neoerp/"
          echo "Code synchronized successfully."

      - name: Execute deployment or update on VM
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          echo "Executing deployment on ${GCP_VM_HOST}..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i /tmp/deploy_key "${GCP_VM_USER}@${GCP_VM_HOST}" '
            set -e
            cd ~/neoerp
            chmod +x deploy-gcp.sh update.sh
            if [ ! -f .env ]; then
              echo "==> Initial installation: launching deploy-gcp.sh..."
              ./deploy-gcp.sh
            else
              echo "==> Existing installation: launching update.sh..."
              ./update.sh
            fi
          '

      - name: Cleanup SSH private key
        if: always()
        run: rm -f /tmp/deploy_key
